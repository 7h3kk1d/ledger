# The iOS app: Capacitor's web view running Ledger's own build (dist/, copied to App/public by
# scripts/ios), plus native pieces in Swift. Generated into Ledger.xcodeproj by xcodegen on the Mac.
name: Ledger
options:
  bundleIdPrefix: me.bandukwala
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    # Capacitor's plugin API predates Swift 6 strict concurrency
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${IOS_TEAM} # scripts/ios passes it from .env.local
    # simulator builds sign ad hoc, which still embeds the entitlements
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
packages:
  Capacitor:
    url: https://github.com/ionic-team/capacitor-swift-pm.git
    exactVersion: 8.6.2
  Automerge:
    url: https://github.com/automerge/automerge-swift
    exactVersion: 0.7.2
targets:
  Ledger:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [public]
      - path: App/public
        type: folder
        buildPhase: resources
      - Shared
    dependencies:
      - package: Capacitor
        product: Capacitor
      - package: Capacitor
        product: Cordova
      - target: LedgerWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bandukwala.Ledger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    attributes:
      SystemCapabilities: # what -allowProvisioningUpdates turns on for the App ID
        com.apple.ApplicationGroups.iOS: {enabled: 1}
        com.apple.HealthKit: {enabled: 1}
    entitlements:
      path: App/Ledger.entitlements
      properties:
        # shared with the widget: Ledger's data files (FileStore), widget.json, widget-changes/
        com.apple.security.application-groups: [group.me.bandukwala.Ledger]
        # reads HealthKit (App/Health/) to push it to a receiver, woken for new data (HealthBackground)
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        # health-records: clinical records from providers linked in Health (asked on their own sheet)
        com.apple.developer.healthkit.access: [health-records]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ledger
        NSHealthShareUsageDescription: Ledger reads your workouts, sleep, activity and measurements to count them toward your habits and send them where you choose.
        NSHealthClinicalHealthRecordsShareUsageDescription: Ledger reads the health records your providers share with Health, to send them where you choose.
        # only debug builds write (simulator tests seed sample data); release builds never ask
        NSHealthUpdateUsageDescription: Debug builds write sample health data for tests.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIViewControllerBasedStatusBarAppearance: true
  LedgerWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: Automerge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bandukwala.Ledger.widget # must extend the app's id
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS: {enabled: 1}
    entitlements:
      path: Widget/LedgerWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.me.bandukwala.Ledger]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Ledger
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Ledger
  # the widget's logic, without its UI or a host app, against storage Ledger's JS wrote
  WidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WidgetTests
      - path: Widget
        excludes: [LedgerWidget.swift, "*.plist", "*.entitlements"]
      - Shared
    dependencies:
      - package: Automerge
  LedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ledger
schemes:
  Ledger:
    build:
      targets:
        Ledger: all
        LedgerTests: [test]
        WidgetTests: [test]
    test:
      targets: [LedgerTests, WidgetTests]
  LedgerUI:
    build:
      targets:
        Ledger: all
        LedgerUITests: [test]
    test:
      targets: [LedgerUITests]
